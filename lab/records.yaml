# Overlay only. Unset keys keep RecordsConfig.cc compiled defaults.
# redirect.actions stays compiled default routable:follow (private/loopback/
# link-local/self/multicast fill RETURN). remap_required stays 1.
records:
  exec_thread:
    autoconfig:
      enabled: 0
    limit: 2
  http:
    cache:
      http: 0
    connect_attempts_max_retries: 0
    connect_attempts_timeout: 5
    number_of_redirections: 1
    server_ports: 8080
  diags:
    debug:
      enabled: 1
      tags: http|dns|redirect
  url_remap:
    remap_required: 1
  reverse_proxy:
    enabled: 1
  cache:
    ram_cache:
      size: 1048576
